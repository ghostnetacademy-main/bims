{% extends "base.html" %}
{% block title %}Admin · {{ ck.event_title }}{% endblock %}
{% block body %}
<div class="card" style="max-width:420px; margin-left:auto; margin-right:auto;">
  <h2>Admin access</h2>
  <p class="muted">Instructor only. Players sign in from the team page.</p>
  <form method="post" action="{{ url_for('admin_panel') }}" autocomplete="off">
    <label for="token">Instructor token</label>
    <input id="token" type="password" name="token" required autocomplete="off">
    <div style="margin-top:16px;"><button type="submit">Enter</button></div>
  </form>
</div>
{% endblock %}
