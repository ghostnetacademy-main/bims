{% extends "base.html" %}
{% block body %}
<div style="max-width:430px;margin:40px auto">
  <div class="card">
    <h2>Staff Sign-in</h2>
    <p class="muted">{{ brgy }} Information Management System. Authorized personnel only.</p>
    {% if error %}<div class="error" style="margin-top:10px">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('login') }}" style="margin-top:12px">
      <label style="font-size:13px;font-weight:600">Username</label>
      <input type="text" name="username" autocomplete="off" style="margin:4px 0 12px">
      <label style="font-size:13px;font-weight:600">Password</label>
      <input type="password" name="password" autocomplete="off" style="margin:4px 0 16px">
      <button type="submit" style="width:100%">Sign in</button>
    </form>
  </div>
  <p class="muted" style="text-align:center">Office of the Punong Barangay · {{ muni }}</p>
</div>
{% endblock %}
